# Développement local : `pnpm services` lance l'infrastructure seule,
# `docker compose up` lance tout, application comprise.
name: regie

services:
  postgres:
    mem_limit: 512m
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: regie
      POSTGRES_PASSWORD: regie
      POSTGRES_DB: regie
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regie"]
      interval: 3s
      retries: 20

  redis:
    mem_limit: 256m
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # MinIO ne publie plus d'images officielles : pgsty/minio est le fork
  # communautaire maintenu. N'importe quel S3 fait l'affaire (R2, Garage, RustFS…).
  minio:
    mem_limit: 512m
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: regie
      MINIO_ROOT_PASSWORD: regie-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  web:
    mem_limit: 1536m
    build: { context: ., dockerfile: apps/web/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://regie:regie@postgres:5432/regie
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    profiles: [app]

  worker:
    mem_limit: 1g
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://regie:regie@postgres:5432/regie
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: [app]

volumes:
  pgdata:
  redisdata:
  miniodata:
